name: Build Radar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build
        working-directory: android
        env:
          RADAR_KEY_PASS: ${{ secrets.RADAR_KEY_PASS }}
        run: gradle assembleRelease --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk Radar.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Radar v${{ github.run_number }}
          files: Radar.apk
          make_latest: true
